version: 1

frontend:
  phases:
    preBuild:
      commands:
        - nvm install 22.22.3
        - nvm use 22.22.3
        - npm ci
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: dist/cms/browser
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
